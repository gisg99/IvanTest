<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Jalisco</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="header">
  <img src="../assets/img/logo.webp" alt="logo">
</header>

<main class="container">

  <div class="card">
    <h3>Jalisco TV</h3>
    <p>Entretenimiento y cultura</p>
  </div>

  <div class="card">
    <h3>Programas Sociales</h3>
    <p>Apoyo y beneficios</p>
  </div>

  <div class="card">
    <h3>Salud</h3>
    <p>Servicios médicos y bienestar</p>
  </div>

  <div class="card">
    <h3>Educación</h3>
    <p>Recursos educativos</p>
  </div>

  <div class="card">
    <h3>Infraestructura</h3>
    <p>Obras y desarrollo urbano</p>
  </div>

  <button class="panic">
  <div class="panic-text">
    <span>Botón de Pánico</span>
    <small>Emergencias 911</small>
  </div>
  <span class="panic-number">911</span>
  </button>

  <button class="internet">Conectar a Internet</button>

</main>

</body>
</html>
